name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected and what you got (paste the output).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Shown by `claude plugin list`
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Repository mode
      options: [Standalone, Portfolio hub, Portfolio member, Not set up]
